name: Publicar no Firebase Hosting

# Publica a app automaticamente sempre que houver alterações no main,
# e permite publicar manualmente a partir do separador Actions.
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Obter o código
        uses: actions/checkout@v4

      - name: Publicar no Firebase Hosting (canal live)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CONTROLE_LEGADO_ACLAMADO }}
          channelId: live
          projectId: controle-legado-aclamado
          # Versão fixa: a 15.34.1 passou a exigir uma permissão (serviceusage.services.get)
          # que a conta de publicação não tem, e a publicação falhava com 403.
          firebaseToolsVersion: 15.34.0

      # Publica também as regras de segurança do Firestore (firestore.rules),
      # para não ser preciso copiá-las à mão no Firebase Console.
      - name: Publicar regras do Firestore
        # A conta de publicação ainda não tem permissão para as regras (403); as regras
        # publicam-se pela app (guia "Falta um passo"). Não marca a publicação como falhada.
        continue-on-error: true
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CONTROLE_LEGADO_ACLAMADO }}
        run: |
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@13 deploy --only firestore:rules --project controle-legado-aclamado --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
